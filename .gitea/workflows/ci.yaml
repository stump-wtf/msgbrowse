---
# The correctness gate on Gitea. Until now this repo had NO test gate on
# gitea.stump.rocks at all: .github/workflows/ci.yml runs `make check`, but
# Gitea only reads .gitea/workflows/, so the source-of-truth forge was merging
# code nothing had compiled.
#
# The pipeline itself lives in stump.wtf/ci and is shared, not copied — the
# aibot workflow demonstrated what copies cost when the same fork-checkout bug
# had to be fixed separately in every repo that pasted it.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: https://gitea.stump.rocks/stump.wtf/ci/.gitea/workflows/go-service.yaml@main
    with:
      # `make check` is gofmt-check + vet + the migration-immutability guard +
      # go test. CGO stays off: the SQLite driver is pure Go (modernc.org/sqlite),
      # and pinning 0 proves the binary stays cgo-free.
      lint_cmd: make check
      build_cmd: make build
      # The migration guard diffs schema.go against the base branch, which a
      # depth-1 checkout does not have.
      fetch_base: true
      # Dockerfile builds on every run; pushes only from main.
      publish_image: true
    secrets: inherit
