# Automatic dot releases
#
# Every push to main on the CANONICAL host (this Gitea repo) tags the next
# patch version and drives the whole release train deterministically:
#
#   1. Tag this repo (vX.Y.Z+1) with a PAT, never the default Actions token —
#      like GitHub, Gitea does not fire downstream workflows for pushes made
#      with the built-in token, and a silent tag with no build is the exact
#      failure this automation exists to end.
#   2. Push the same tag to the GitHub mirror and workflow_dispatch
#      desktop.yml on it, so the desktop matrix builds and publishes the
#      GitHub Release (macOS runners only exist there). This bypasses the
#      push-mirror's 8h sync interval, which otherwise delays the release by
#      up to most of a day.
#   3. Bump stump.wtf/homebrew-tap (formula + desktop cask) inline once the
#      GitHub assets appear — this is the only runner that can reach both
#      forges, and cross-workflow dispatch is unsupported on this Gitea
#      (the dispatch API 404s), so the bump runs in this same workflow.
#
# Historically tags were cut by hand and the tap was bumped by hand, and
# whenever either was forgotten `brew` kept serving an old version for days
# (v0.8.1 shipped with the desktop cask stuck behind for days). Do not
# reintroduce a manual step anywhere in this chain.
#
# This file lives under .gitea/workflows (not .github/workflows) so ONLY the
# canonical host runs it — the GitHub mirror must never tag independently of
# this repo, or the two hosts' version counters diverge.
#
# @joestump-agent 09/03/2026 - Created. Tags every main push with the next
#   patch version; minor/major bumps stay manual (`git tag vX.Y.0`).

name: Auto release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag next patch version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.next }}
    env:
      GH_MIRROR_URL: https://github.com/stump-wtf/msgbrowse.git
      GH_API: https://api.github.com/repos/stump-wtf/msgbrowse
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        name: Compute and push the next patch tag
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${TAP_PUSH_TOKEN:-}" ] || {
            echo "::error::TAP_PUSH_TOKEN is not set. Add a Gitea PAT with" \
                 "write:repository as an Actions secret. Without it the tag" \
                 "lands but no build or tap bump runs."
            exit 1
          }
          [ -n "${GH_MIRROR_TOKEN:-}" ] || {
            echo "::error::GH_MIRROR_TOKEN is not set. Add a GitHub PAT with" \
                 "contents:write on stump-wtf/msgbrowse as an Actions secret." \
                 "Without it the desktop build never runs."
            exit 1
          }
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          latest=${latest#v}
          IFS=. read -r major minor patch <<< "${latest:-0.0.0}"
          next="v${major}.${minor}.$((patch + 1))"
          echo "tagging $next (previous: v${latest:-none})"
          echo "next=${next}" >> "$GITHUB_OUTPUT"
          git config user.name "joestump-agent"
          git config user.email "joestump-agent@noreply.stump.rocks"
          git tag -a "$next" -m "Automated release ${next}"
          # PAT pushes fire downstream workflows; default-token pushes do not.
          git -c "http.extraheader=Authorization: token ${TAP_PUSH_TOKEN}" \
            push origin "${next}"

      - name: Push the tag to the GitHub mirror and dispatch the desktop build
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          TAG: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          git -c "http.extraheader=Authorization: Basic $(printf 'x-access-token:%s' "$GH_MIRROR_TOKEN" | base64)" \
            push "${GH_MIRROR_URL}" "${TAG}"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: token ${GH_MIRROR_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GH_API}/actions/workflows/desktop.yml/dispatches" \
            -d "{\"ref\":\"${TAG}\"}")
          echo "desktop dispatch on ${TAG}: HTTP ${code}"
          [ "$code" = "204" ]

  tap-bump:
    name: Bump the Homebrew tap
    needs: [tag]
    runs-on: ubuntu-latest
    env:
      TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
      GH_REPO_URL: https://github.com/stump-wtf/msgbrowse
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - name: Wait for the GitHub release assets
        # The desktop leg takes ~3-5 min on the mirror. HEAD the download
        # URLs rather than the API: asset URLs are not subject to the 60/hr
        # unauthenticated API rate limit, and a 200 means the bytes are
        # actually fetchable, which is what the tap needs to be true.
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          SRC_URL="$GH_REPO_URL/releases/download/$TAG/msgbrowse-v${VER}-source.tar.gz"
          ZIP_URL="$GH_REPO_URL/releases/download/$TAG/msgbrowse-desktop_darwin_universal.zip"
          {
            echo "SRC_URL=$SRC_URL"
            echo "ZIP_URL=$ZIP_URL"
            echo "VER=$VER"
          } >> "$GITHUB_ENV"
          for i in $(seq 1 40); do
            if curl -sfIL --max-time 30 -o /dev/null "$SRC_URL" \
               && curl -sfIL --max-time 30 -o /dev/null "$ZIP_URL"; then
              echo "both assets present after $(( (i - 1) * 30 ))s"
              exit 0
            fi
            sleep 30
          done
          echo "::error::$TAG assets never appeared on $GH_REPO_URL after 20m." \
               "Check the Desktop workflow on the mirror."
          exit 1

      - name: Download assets and checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          curl -sfL --retry 3 --retry-all-errors -o "dist/src.tar.gz" "$SRC_URL"
          curl -sfL --retry 3 --retry-all-errors -o "dist/desktop.zip" "$ZIP_URL"
          echo "SHA_SRC=$(sha256sum dist/src.tar.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "SHA_ZIP=$(sha256sum dist/desktop.zip | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Bump the tap
        run: |
          set -euo pipefail
          git clone -q "https://gitea.stump.rocks/stump.wtf/homebrew-tap.git" tap
          cd tap
          F="Formula/msgbrowse.rb"; C="Casks/msgbrowse-desktop.rb"

          # The formula pins an explicit tag in its url; the cask interpolates
          # v#{version}, so rewriting its `version` line moves the url with it.
          sed -i -E "s|releases/download/v[0-9.]+/msgbrowse-v[0-9.]+-source\.tar\.gz|releases/download/${TAG}/msgbrowse-v${VER}-source.tar.gz|" "$F"
          sed -i -E "s|^(  sha256 )\"[0-9a-f]{64}\"|\1\"${SHA_SRC}\"|" "$F"
          sed -i -E "s|^(  version )\"[0-9.]+\"|\1\"${VER}\"|" "$C"
          sed -i -E "s|^(  sha256 )\"[0-9a-f]{64}\"|\1\"${SHA_ZIP}\"|" "$C"

          # Assert every rewrite landed. sed exits 0 when a pattern does not
          # match, so without this a drifted formula would commit unchanged.
          grep -q "releases/download/${TAG}/msgbrowse-v${VER}-source.tar.gz" "$F"
          grep -q "sha256 \"${SHA_SRC}\"" "$F"
          grep -q "version \"${VER}\"" "$C"
          grep -q "sha256 \"${SHA_ZIP}\"" "$C"

          git config user.name "joestump-agent"
          git config user.email "joestump-agent@noreply.stump.rocks"
          if git diff --quiet; then
            echo "tap already at v${VER} — nothing to push"
          else
            git commit -aqm "toil(msgbrowse): bump formula + cask to v${VER} (automated tap bump)"
            git -c http.extraheader="Authorization: token ${TAP_PUSH_TOKEN}" \
              push -q origin HEAD:main
            echo "tap bumped to v${VER}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Mirror assets onto the Gitea release
        # Best-effort and explicitly non-fatal: the tap installs from the
        # GitHub release, so this only keeps the canonical release page from
        # looking empty. It must never be able to cost a release its tap bump.
        continue-on-error: true
        run: |
          set -uo pipefail
          command -v jq >/dev/null 2>&1 || sudo apt-get install -y -qq jq
          API="https://gitea.stump.rocks/api/v1"
          AUTH="Authorization: token ${TAP_PUSH_TOKEN}"
          if ! RID=$(curl -sf --max-time 30 -H "$AUTH" \
              "$API/repos/stump.wtf/msgbrowse/releases/tags/$TAG" | jq -r '.id'); then
            echo "could not read the Gitea release for $TAG — skipping asset mirror"
            exit 0
          fi
          upload() { # $1 = local file, $2 = asset name
            OLD=$(curl -sf --max-time 30 -H "$AUTH" \
              "$API/repos/stump.wtf/msgbrowse/releases/$RID/assets?limit=50" \
              | jq -r ".[] | select(.name == \"$2\") | .id")
            [ -z "$OLD" ] || curl -sf --max-time 60 -X DELETE -H "$AUTH" \
              "$API/repos/stump.wtf/msgbrowse/releases/$RID/assets/$OLD" || true
            curl -sf --max-time 900 -X POST -H "$AUTH" \
              "$API/repos/stump.wtf/msgbrowse/releases/$RID/assets?name=$2" \
              -F "attachment=@$1" > /dev/null \
              && echo "attached $2" || echo "could not attach $2"
          }
          upload "dist/src.tar.gz" "msgbrowse-v${VER}-source.tar.gz"
          upload "dist/desktop.zip" "msgbrowse-desktop_darwin_universal.zip"
