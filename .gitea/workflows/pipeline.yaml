---
# The single end-to-end pipeline. One run, one dependency graph:
#
#   secret scan → lint → test → build → ai review
#                                          │  (merge to main only)
#                          desktop apps ·  packages · Gitea Pages
#
# Replaces five workflows that raced each other: .gitea/workflows/{aibot.yml,
# gitleaks.yaml,ci.yaml} plus the .github/workflows/{ci,css,desktop,security}.yml
# set that Gitea ran until .gitea/workflows/ appeared and shadowed it. The
# .github/ copies stay for the GitHub mirror; Gitea now reads only this file.
#
# Ordering is deliberate, not cosmetic:
#   * Secrets first — a leaked credential is the one finding that must not wait
#     behind a compile.
#   * AI review LAST, behind the build. As a separate workflow it fired the
#     moment a PR opened and spent tokens reviewing code that had not yet been
#     shown to compile or pass tests. Now it only runs on a green build.
#   * Everything after `main-only` is fenced to a push on the default branch,
#     so a PR (including from a fork) can build a desktop app or a docs site
#     but can never publish or deploy one.
#
# The stages themselves live in stump.wtf/ci and are shared, not copied.
name: pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write
  packages: write
  pull-requests: write
  issues: write

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  # ---- 1. secret scan ------------------------------------------------------
  secrets:
    uses: https://gitea.stump.rocks/stump.wtf/ci/.gitea/workflows/gitleaks.yaml@main
    secrets: inherit

  # ---- 2-4. lint + test + build (+ image build) ---------------------------
  build:
    needs: [secrets]
    uses: https://gitea.stump.rocks/stump.wtf/ci/.gitea/workflows/go-service.yaml@main
    with:
      # gofmt-check + vet + the migration-immutability guard + go test.
      lint_cmd: make check
      build_cmd: make build
      # The migration guard diffs schema.go against the base branch, which a
      # depth-1 checkout does not have.
      fetch_base: true
      # Builds the image on every run; pushes only from the default branch.
      publish_image: true
    secrets: inherit

  # ---- 4b. docs site build (PRs only, never publishes) --------------------
  # The docs site used to be compiled ONLY by the `pages` job below, which sits
  # behind `main-only`. Nothing in the repo built docs-site on a pull request,
  # so every docs dependency bump went green without anything having compiled
  # it, and breakage surfaced as a red main and a failed Pages deploy. Eight
  # such PRs were open at once in August 2026 (#319-#326); the Docusaurus 3.10
  # bump among them failed the build outright, and no check said so.
  #
  # `publish: "false"` is hardcoded rather than computed. The shared workflow
  # gates publishing opt-out (`!= 'false'`) precisely because this runner has
  # dropped caller-passed values before, and a PR must never be one mangled
  # expression away from overwriting the live site.
  docs:
    needs: [secrets]
    if: ${{ github.event_name == 'pull_request' }}
    uses: https://gitea.stump.rocks/stump.wtf/ci/.gitea/workflows/static-site.yaml@main
    with:
      working_directory: docs-site
      source_dir: docs-site/build
      publish: "false"
      # typecheck BEFORE build, not instead of it. `docusaurus build` runs the
      # sources through webpack/babel, which strips TypeScript types without
      # checking them — so a bump that breaks `tsc` builds a perfectly good
      # site and goes green. The typescript v7 bump (#355) did exactly that:
      # TS7 removed `baseUrl`, which @docusaurus/tsconfig still sets, so
      # `npm run typecheck` failed while `npm run build` succeeded and every
      # check in the repo was green. Same blind-spot shape as 4b itself.
      build_cmd: npm run typecheck && npm run build
    secrets: inherit

  # ---- 4c. desktop module tests (PRs too) ----------------------------------
  # `cmd/msgbrowse-desktop` is a nested Go module pinned to the root one by a
  # `replace` directive, and `go` refuses to build it once the two drift: the
  # lipgloss v2.0.6 bump (#343) merged green because nothing on a PR exercised
  # the desktop module — `make desktop-test` only ran inside the main-only
  # `desktop` job, so the `go mod tidy` the bump required surfaced as a red
  # main (run 6669) instead of a red PR. Same failure class the docs job (4b)
  # was added for. The tests are pure Go — no GTK/webview toolchain — so they
  # are cheap enough to run on every PR.
  desktop-test:
    needs: [secrets]
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            cmd/msgbrowse-desktop/go.sum
      - name: Headless desktop module tests
        run: make desktop-test

  # ---- 5. ai review (PRs only, and only once the build is green) ----------
  review:
    needs: [build]
    if: ${{ github.event_name == 'pull_request' }}
    uses: https://gitea.stump.rocks/stump.wtf/ci/.gitea/workflows/aibot.yaml@main
    secrets: inherit

  # ---- 6. merge-to-main gate ----------------------------------------------
  # A single explicit gate rather than repeating the same `if:` on three jobs.
  # Downstream stages just `needs: [main-only]`, so the fence is stated once
  # and cannot drift between them.
  main-only:
    needs: [build]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: echo "on main with a green build — releasing" >> "$GITHUB_STEP_SUMMARY"

  # ---- 7a. desktop apps ---------------------------------------------------
  # Linux only. The macOS half of .github/workflows/desktop.yml needs
  # `runs-on: macos-latest`, and this instance has no macOS runner — building
  # the universal .app stays on the GitHub mirror until one exists.
  desktop:
    needs: [main-only]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Wails links the system webview on Linux, so the build needs GTK3 +
      # WebKit2GTK headers and cgo — `make desktop-linux` carries the
      # `webkit2_41` tag matching Ubuntu 24.04's webkit2gtk-4.1. Without this
      # the build fails at link time on a bare runner image.
      - name: Install GTK3 + WebKit2GTK dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            cmd/msgbrowse-desktop/go.sum

      - name: Headless module tests (pure Go)
        run: make desktop-test

      - name: Build Linux desktop binary
        run: make desktop-linux
      # NOTE: no actions/upload-artifact — v4 fails on this act_runner (it
      # reports as GHES and exits 1). The binary is proven to build; publishing
      # it is the release job's business on the mirror.
      - name: Summary
        run: echo "Linux desktop binary built" >> "$GITHUB_STEP_SUMMARY"

  # ---- 7b. Gitea Pages ----------------------------------------------------
  pages:
    needs: [main-only]
    uses: https://gitea.stump.rocks/stump.wtf/ci/.gitea/workflows/static-site.yaml@main
    with:
      working_directory: docs-site
      source_dir: docs-site/build
    secrets: inherit

  # ---- 8. Homebrew tap bump (tags only) -----------------------------------
  # The Bump Runs Here, Not On The GitHub Mirror
  #
  # This job used to be a step in .github/workflows/desktop.yml, on a
  # GitHub-hosted runner. gitea.stump.rocks is an RFC1918 address, so that
  # runner could never reach it: the step died at curl exit 28 on its first
  # call to the Gitea API on every tag from v0.6.0 on. The failure was easy to
  # miss because the GitHub Release itself published fine, so the automated
  # bump never once succeeded — every version in stump.wtf/homebrew-tap was
  # pasted in by hand, and Casks/msgbrowse-desktop.rb silently sat at 0.5.0 for
  # three releases while the formula moved on without it.
  #
  # This runner is the only host that can reach BOTH sides: Gitea over the LAN
  # and github.com outbound. So the bump belongs here. The darwin .app is still
  # built on the mirror because no macOS runner exists on this instance, so the
  # job waits for that release to publish, then bumps the tap from its assets.
  #
  # @joestump 08/28/2026 - Moved here from desktop.yml. Two ordering fixes came
  # with it: the tap bump now runs BEFORE the (optional, best-effort) mirror of
  # assets back onto the Gitea release, and a missing token FAILS rather than
  # skipping. The old step did the reverse on both counts — one `set -e` block
  # with the bump last, gated on `if: env.GITEA_PAT != ''` — which is precisely
  # how three releases shipped with nobody noticing.
  tap-bump:
    needs: [build]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    env:
      TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
      # Public, unauthenticated reads — the release and its assets are public.
      GH_REPO_URL: https://github.com/stump-wtf/msgbrowse
    steps:
      - name: Require the tap push token
        # Deliberately fatal. A silent skip here is the exact failure mode this
        # job exists to end: the release goes green, the tap never moves, and
        # the gap only surfaces weeks later as "brew won't update".
        run: |
          set -euo pipefail
          if [ -z "${TAP_PUSH_TOKEN:-}" ]; then
            echo "::error::TAP_PUSH_TOKEN is not set. Create a Gitea PAT with" \
                 "write:repository on stump.wtf/homebrew-tap and add it as an" \
                 "org or repo Actions secret named TAP_PUSH_TOKEN."
            exit 1
          fi

      - name: Wait for the GitHub release assets
        # The darwin leg of desktop.yml takes ~6-8 min on the mirror, and the
        # Gitea tag push and the GitHub one land at essentially the same moment,
        # so this job is always early. HEAD the download URLs rather than the
        # API: asset URLs are not subject to the 60/hr unauthenticated API rate
        # limit, and a 200 means the bytes are actually fetchable, which is what
        # the tap needs to be true.
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          SRC_URL="$GH_REPO_URL/releases/download/$TAG/msgbrowse-v${VER}-source.tar.gz"
          ZIP_URL="$GH_REPO_URL/releases/download/$TAG/msgbrowse-desktop_darwin_universal.zip"
          {
            echo "SRC_URL=$SRC_URL"
            echo "ZIP_URL=$ZIP_URL"
            echo "TAG=$TAG"
            echo "VER=$VER"
          } >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if curl -sfIL --max-time 30 -o /dev/null "$SRC_URL" \
               && curl -sfIL --max-time 30 -o /dev/null "$ZIP_URL"; then
              echo "both assets present after $(( (i - 1) * 30 ))s"
              exit 0
            fi
            sleep 30
          done
          echo "::error::$TAG assets never appeared on $GH_REPO_URL after 30m." \
               "Check the Desktop workflow on the mirror."
          exit 1

      - name: Download assets and checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          curl -sfL --retry 3 --retry-all-errors -o "dist/src.tar.gz" "$SRC_URL"
          curl -sfL --retry 3 --retry-all-errors -o "dist/desktop.zip" "$ZIP_URL"
          echo "SHA_SRC=$(sha256sum dist/src.tar.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "SHA_ZIP=$(sha256sum dist/desktop.zip | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Bump the Homebrew tap
        run: |
          set -euo pipefail
          git clone -q "https://gitea.stump.rocks/stump.wtf/homebrew-tap.git" tap
          cd tap
          F="Formula/msgbrowse.rb"; C="Casks/msgbrowse-desktop.rb"

          # The formula pins an explicit tag in its url; the cask interpolates
          # v#{version}, so rewriting its `version` line moves the url with it.
          sed -i -E "s|releases/download/v[0-9.]+/msgbrowse-v[0-9.]+-source\.tar\.gz|releases/download/${TAG}/msgbrowse-v${VER}-source.tar.gz|" "$F"
          sed -i -E "s|^(  sha256 )\"[0-9a-f]{64}\"|\1\"${SHA_SRC}\"|" "$F"
          sed -i -E "s|^(  version )\"[0-9.]+\"|\1\"${VER}\"|" "$C"
          sed -i -E "s|^(  sha256 )\"[0-9a-f]{64}\"|\1\"${SHA_ZIP}\"|" "$C"

          # Assert every rewrite landed. sed exits 0 when a pattern does not
          # match, so without this a drifted formula would commit unchanged.
          grep -q "releases/download/${TAG}/msgbrowse-v${VER}-source.tar.gz" "$F"
          grep -q "sha256 \"${SHA_SRC}\"" "$F"
          grep -q "version \"${VER}\"" "$C"
          grep -q "sha256 \"${SHA_ZIP}\"" "$C"

          git config user.name "joestump-agent"
          git config user.email "joestump-agent@noreply.stump.rocks"
          if git diff --quiet; then
            echo "tap already at v${VER} — nothing to push"
          else
            git commit -aqm "toil(msgbrowse): bump formula + cask to v${VER} (automated tap bump)"
            git -c http.extraheader="Authorization: token ${TAP_PUSH_TOKEN}" \
              push -q origin HEAD:main
            echo "tap bumped to v${VER}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Mirror assets onto the Gitea release
        # Best-effort and explicitly non-fatal: the tap installs from the GitHub
        # release, so this only keeps the canonical release page from looking
        # empty. It must never be able to cost a release its tap bump again,
        # which is why it runs last and cannot fail the job.
        continue-on-error: true
        run: |
          set -uo pipefail
          # jq is not guaranteed on the act_runner image, and this step must not
          # fail quietly for want of it.
          command -v jq >/dev/null 2>&1 || sudo apt-get install -y -qq jq
          API="https://gitea.stump.rocks/api/v1"
          AUTH="Authorization: token ${TAP_PUSH_TOKEN}"
          if ! RID=$(curl -sf --max-time 30 -H "$AUTH" \
              "$API/repos/stump.wtf/msgbrowse/releases/tags/$TAG" | jq -r '.id'); then
            echo "could not read the Gitea release for $TAG — skipping asset mirror"
            exit 0
          fi
          upload() { # $1 = local file, $2 = asset name
            OLD=$(curl -sf --max-time 30 -H "$AUTH" \
              "$API/repos/stump.wtf/msgbrowse/releases/$RID/assets?limit=50" \
              | jq -r ".[] | select(.name == \"$2\") | .id")
            [ -z "$OLD" ] || curl -sf --max-time 60 -X DELETE -H "$AUTH" \
              "$API/repos/stump.wtf/msgbrowse/releases/$RID/assets/$OLD" || true
            curl -sf --max-time 900 -X POST -H "$AUTH" \
              "$API/repos/stump.wtf/msgbrowse/releases/$RID/assets?name=$2" \
              -F "attachment=@$1" > /dev/null \
              && echo "attached $2" || echo "could not attach $2"
          }
          upload "dist/src.tar.gz" "msgbrowse-v${VER}-source.tar.gz"
          upload "dist/desktop.zip" "msgbrowse-desktop_darwin_universal.zip"
